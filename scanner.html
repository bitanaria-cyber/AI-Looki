<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 진위 판별 | AI Looki Guard</title>
  <meta
    name="description"
    content="중고거래 상품 이미지를 업로드하면 이미지 조작 가능성과 위험 근거를 브라우저에서 분석합니다."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="AI Looki Guard 홈">
      <span class="brand-mark" aria-hidden="true"></span>
      AI Looki Guard
    </a>
    <nav class="nav-links" aria-label="주요 섹션">
      <a href="scanner.html">분석</a>
      <a href="index.html#problem">문제</a>
      <a href="index.html#features">기능</a>
      <a href="index.html#build">구현</a>
      <a href="index.html#roadmap">일정</a>
    </nav>
  </header>

  <main id="top">
    <section id="scanner" class="section scanner-section scanner-page" aria-labelledby="scanner-title">
      <div class="section-heading">
        <p class="eyebrow">Live Scanner</p>
        <h1 id="scanner-title">이미지 진위 여부 판별</h1>
        <p class="hero-lead">
          중고거래 상품 사진을 업로드하면 브라우저에서 이미지 신호를 분석해 조작 가능성과 핵심 근거를 표시합니다.
        </p>
      </div>

      <div class="scanner-layout">
        <section class="scanner-panel upload-panel" aria-label="이미지 업로드">
          <label class="upload-zone" id="dropZone" for="imageInput">
            <span class="upload-token">AI</span>
            <strong>상품 이미지 업로드</strong>
            <span>JPG, PNG, WebP</span>
          </label>
          <input class="sr-only" id="imageInput" type="file" accept="image/png,image/jpeg,image/webp">

          <label class="field-label" for="listingText">판매 설명</label>
          <textarea
            id="listingText"
            rows="4"
            placeholder="예: 생활 흠집 조금 있는 A급 스마트폰입니다."
          ></textarea>

          <div class="scanner-actions">
            <button class="button button-primary" id="analyzeButton" type="button" disabled>분석 실행</button>
            <button class="button button-secondary" id="resetButton" type="button">초기화</button>
          </div>

          <div class="preview-box">
            <img id="previewImage" alt="업로드한 상품 이미지 미리보기">
            <div class="preview-placeholder" id="previewPlaceholder">미리보기 대기</div>
          </div>
          <p class="preview-meta" id="previewMeta">선택된 이미지가 없습니다.</p>
        </section>

        <section class="scanner-panel result-panel" aria-label="분석 결과">
          <div class="result-topline">
            <span class="verdict-badge neutral" id="resultBadge">대기</span>
            <span class="model-chip">On-device analysis</span>
          </div>

          <div class="risk-meter">
            <div class="risk-ring" id="riskRing">
              <strong id="riskValue">--</strong>
              <span>%</span>
            </div>
            <div>
              <h3 id="resultTitle">이미지를 업로드하세요</h3>
              <p id="resultSummary">분석 결과가 여기에 표시됩니다.</p>
            </div>
          </div>

          <div class="meter-bar" aria-hidden="true">
            <span id="meterFill"></span>
          </div>

          <ul class="result-list" id="reasonList">
            <li>이미지 선택 후 분석을 실행하면 주요 의심 근거가 정리됩니다.</li>
          </ul>

          <div class="metric-grid" id="metricGrid">
            <article>
              <span>메타데이터</span>
              <strong>--</strong>
            </article>
            <article>
              <span>압축 흔적</span>
              <strong>--</strong>
            </article>
            <article>
              <span>노이즈 균일도</span>
              <strong>--</strong>
            </article>
            <article>
              <span>패턴 반복</span>
              <strong>--</strong>
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
